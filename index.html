<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldbrooks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1a1a1a;
      color: #f5f5f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .logo {
      position: fixed;
      top: 32px;
      left: 40px;
      height: 28px;
      z-index: 10;
    }
    .intro {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 120px 40px 80px;
      background: linear-gradient(180deg, #1a1a1a 0%, #2a2a2a 100%);
      transition: background 0.6s ease;
    }
    .intro.home { background: linear-gradient(180deg, #d8d8d4 0%, #c8c8c4 100%); color: #2a2a2a; }
    .intro.commercial { background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%); color: #f5f5f0; }
    .intro.resort { background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%); color: #f5f5f0; }
    .tagline {
      font-size: 15px;
      letter-spacing: 0.04em;
      margin-bottom: 48px;
      opacity: 0.7;
    }
    .paths {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
    }
    .path {
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .path:hover { opacity: 0.7; }
    .path h2 {
      font-size: 42px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .path p {
      font-size: 15px;
      opacity: 0.6;
      max-width: 220px;
    }
    .reviews {
      margin-top: 64px;
      font-size: 14px;
      opacity: 0.5;
      letter-spacing: 0.02em;
    }
    @media (max-width: 768px) {
      .logo { left: 24px; top: 24px; }
      .intro { padding: 100px 24px 60px; }
      .paths { flex-direction: column; gap: 32px; }
      .path h2 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <img src="assets/fieldbrooks-logo-white.png" alt="Fieldbrooks" class="logo" id="logo">

  <section class="intro" id="intro">
    <div class="tagline">Built around you.</div>
    <div class="paths">
      <div class="path" data-path="home">
        <h2>Home</h2>
        <p>Relief, everyday comfort.</p>
      </div>
      <div class="path" data-path="commercial">
        <h2>Commercial</h2>
        <p>Confidence, control, progress.</p>
      </div>
      <div class="path" data-path="resort">
        <h2>Resort Living</h2>
        <p>Desire, delight, belonging.</p>
      </div>
    </div>
    <div class="reviews">80+ five-star reviews</div>
  </section>

  <script>
    const intro = document.getElementById('intro');
    const logo = document.getElementById('logo');
    document.querySelectorAll('.path').forEach(el => {
      el.addEventListener('click', () => {
        const path = el.dataset.path;
        intro.className = 'intro ' + path;
        logo.src = path === 'home' 
          ? 'assets/fieldbrooks-logo-dark.png' 
          : 'assets/fieldbrooks-logo-white.png';
        // Placeholder: next step is city + menu
        console.log('Path selected:', path);
      });
    });
  </script>
</body>
</html>
